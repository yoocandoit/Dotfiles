# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 5
  gaps_out = 10

  col.active_border = $color12
  col.inactive_border = rgba(313244aa)
}

decoration {
  rounding = 10
  
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 1
    render_power = 1

    color =  $color12
    color_inactive = rgba(00000000)
  }

  blur {
    enabled = true
    size = 3
    passes = 1
    vibrancy = 0.1696
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}

# blur waybar
layerrule {
    name = waybar_blur
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.4
}

# blur swaync
layerrule {
    name = swaync_blur
    match:namespace = swaync-(notification-window|control-center)
    blur = on
    ignore_alpha = 0.4
}

